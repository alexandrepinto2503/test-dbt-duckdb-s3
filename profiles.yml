test_dbt_duckdb_s3:
  target: local
  outputs:
    local:
      type: duckdb
      path: ":memory:"
      threads: 4
      extensions:
        - httpfs
      secrets:
        - type: s3
          provider: config
          key_id: "{{ env_var('AWS_ACCESS_KEY_ID') }}"
          secret: "{{ env_var('AWS_SECRET_ACCESS_KEY') }}"
          region: "{{ env_var('AWS_REGION', 'us-east-1') }}"
          endpoint: "{{ env_var('DUCKDB_S3_ENDPOINT', 'minio:9000') }}"
          url_style: path
          use_ssl: false

    aws:
      type: duckdb
      path: ":memory:"
      threads: 4
      extensions:
        - httpfs
        - aws
      secrets:
        - type: s3
          provider: credential_chain
          region: ap-southeast-2